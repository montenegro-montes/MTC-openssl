name: mtcapture
x-lab: &lab
  image: mt-tls-measurement:local
  volumes:
    - ../artifacts:/work:ro
    - ${CAPTURE_ROOT:?Set CAPTURE_ROOT to an absolute output directory}:/capture
  environment:
    COMPACT_BATCH: /work/compact/batch16
    MTC_BATCH: /work/mtc/batch16-v2
    PROFILE_DETAIL: "0"
    MEASUREMENT_RUN_ROOT: /capture
    MEASUREMENT_CAMPAIGN_ID: runtime
    MEASUREMENT_SEED: ${CAPTURE_SEED:-500001}
services:
  server:
    <<: *lab
    command: ["python3", "/opt/measurement/serve.py"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/measurement-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  client:
    <<: *lab
    volumes:
      - ../artifacts:/work:ro
      - ${CAPTURE_ROOT:?Set CAPTURE_ROOT to an absolute output directory}:/capture
      - ../campaigns/handshake_capture:/opt/handshake-capture:ro
    command: ["python3", "/opt/handshake-capture/client.py", "--output", "/capture"]
  capture:
    image: mt-tls-capture:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.capture
    network_mode: "service:server"
    depends_on:
      server:
        condition: service_healthy
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ${CAPTURE_ROOT:?Set CAPTURE_ROOT to an absolute output directory}:/capture
    command: ["tcpdump", "-i", "eth0", "-s", "0", "-U", "-w", "/capture/handshakes.pcap", "tcp portrange 4433-4446"]
  analyzer:
    image: mt-tls-capture:local
    volumes:
      - ${CAPTURE_ROOT:?Set CAPTURE_ROOT to an absolute output directory}:/capture
      - ../campaigns/handshake_capture:/opt/handshake-capture:ro
    command: ["python3", "/opt/handshake-capture/analyze.py", "/capture"]

name: mtscaling
x-lab: &lab
  image: sha256:4b04891fc50251a422c3357f35f355151ea50150d0e678dadde8c8f97b968b43
  volumes:
    - ../artifacts:/work:ro
    - ../artifacts/results:/work/results
    - ../campaigns/scaling_campaign:/opt/scaling:ro
  environment:
    COMPACT_BATCH: ${SCALING_FIXTURES:?Set SCALING_FIXTURES}/batch${TREE_SIZE:?Set TREE_SIZE}/compact
    MTC_BATCH: ${SCALING_FIXTURES}/batch${TREE_SIZE}/mtc
    PROFILE_DETAIL: ${SCALING_DETAIL:-0}
    MEASUREMENT_RUN_ROOT: ${MEASUREMENT_RUN_ROOT:?Set MEASUREMENT_RUN_ROOT}
    MEASUREMENT_CAMPAIGN_ID: ${MEASUREMENT_CAMPAIGN_ID:?Set MEASUREMENT_CAMPAIGN_ID}
    MEASUREMENT_SEED: ${MEASUREMENT_SEED:?Set MEASUREMENT_SEED}
services:
  server:
    <<: *lab
    command: ["python3", "/opt/measurement/serve.py"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/measurement-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  client:
    <<: *lab
    command: ["python3", "/opt/measurement/measure.py"]

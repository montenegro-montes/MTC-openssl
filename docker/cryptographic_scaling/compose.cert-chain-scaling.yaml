name: certchainscaling
x-common: &common
  image: ${CERT_CHAIN_IMAGE:-mt-tls-measurement:local}
  volumes:
    - ../..:/repo:ro
    - ${CERT_CHAIN_FIXTURES:?Set CERT_CHAIN_FIXTURES}:/fixtures:ro
    - ${CERT_CHAIN_RESULTS:?Set CERT_CHAIN_RESULTS}:/results
  environment:
    CERT_FIXTURE: /fixtures/${CERT_PROFILE:?Set CERT_PROFILE}/depth-${CERT_DEPTH:?Set CERT_DEPTH}
    SERVER_METRICS: /results/${CERT_CAMPAIGN:?Set CERT_CAMPAIGN}/endpoint-metrics
    PROFILE_DETAIL: "1"
services:
  server:
    <<: *common
    command: ["python3", "/repo/campaigns/cryptographic_scaling/cert_chain_scaling/server.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;s=socket.create_connection(('127.0.0.1',4433),1);s.close()"]
      interval: 1s
      timeout: 1s
      retries: 30
  client:
    <<: *common
    environment:
      CERT_FIXTURE: /fixtures/${CERT_PROFILE:?Set CERT_PROFILE}/depth-${CERT_DEPTH:?Set CERT_DEPTH}
      SERVER_METRICS: /results/${CERT_CAMPAIGN:?Set CERT_CAMPAIGN}/endpoint-metrics
      CAMPAIGN_OUTPUT: /results/${CERT_CAMPAIGN:?Set CERT_CAMPAIGN}/data
      PROFILE_DETAIL: "1"
      FIXTURE_SHA256: ${FIXTURE_SHA256:?Set FIXTURE_SHA256}
      SOURCE_COMMIT: ${SOURCE_COMMIT:?Set SOURCE_COMMIT}
      IMAGE_ID: ${IMAGE_ID:?Set IMAGE_ID}
      CERT_PROFILE_NAME: ${CERT_PROFILE}
      CERT_DEPTH_VALUE: ${CERT_DEPTH}
    command: ["python3", "/repo/campaigns/cryptographic_scaling/cert_chain_scaling/measure.py"]

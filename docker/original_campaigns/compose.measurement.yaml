name: controlledn16
x-lab: &lab
  image: mt-tls-measurement:local
  build:
    context: ../..
    dockerfile: docker/original_campaigns/Dockerfile.measurement
  volumes:
    - ../../artifacts:/work:ro
    - ../../artifacts/results:/work/results
  environment:
    COMPACT_BATCH: /work/compact/batch16
    MTC_BATCH: /work/mtc/batch16-v2
    PROFILE_DETAIL: "0"
    MEASUREMENT_PCAP: ${MEASUREMENT_PCAP:-0}
    MEASUREMENT_RUN_ROOT: ${MEASUREMENT_RUN_ROOT:?Set MEASUREMENT_RUN_ROOT to the new experiment directory}
    MEASUREMENT_CAMPAIGN_ID: ${MEASUREMENT_CAMPAIGN_ID:-campaign-01}
    MEASUREMENT_SEED: ${MEASUREMENT_SEED:-42}
services:
  server:
    <<: *lab
    command: ["python3", "/opt/measurement/serve.py"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/measurement-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  client:
    <<: *lab
    command: ["python3", "/opt/measurement/measure.py"]
  capture:
    profiles: [pcap]
    image: mt-tls-capture:local
    network_mode: "service:server"
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ../../artifacts/results:/work/results
      - ../../campaigns/original_campaigns/controlled_n16_campaign:/opt/measurement:ro
      - ../../campaigns/original_campaigns/handshake_capture:/opt/handshake-capture:ro
    command: ["python3", "/opt/measurement/capture.py", "serve", "${MEASUREMENT_RUN_ROOT}/${MEASUREMENT_CAMPAIGN_ID:-campaign-01}/pcap"]

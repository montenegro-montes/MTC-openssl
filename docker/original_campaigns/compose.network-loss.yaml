name: mtloss
x-lab: &lab
  image: mt-tls-network:latency
  cap_add: [NET_ADMIN]
  volumes:
    - ../../artifacts:/work:ro
    - ../../artifacts/results:/work/results
    - ../../campaigns/original_campaigns/packet_loss_campaign:/opt/network-loss:ro
  environment:
    COMPACT_BATCH: /work/compact/batch16
    MTC_BATCH: /work/mtc/batch16-v2
    PROFILE_DETAIL: "0"
    MEASUREMENT_RUN_ROOT: ${MEASUREMENT_RUN_ROOT:?Set MEASUREMENT_RUN_ROOT}
    MEASUREMENT_CAMPAIGN_ID: ${MEASUREMENT_CAMPAIGN_ID:?Set MEASUREMENT_CAMPAIGN_ID}
    MEASUREMENT_SEED: ${MEASUREMENT_SEED:?Set MEASUREMENT_SEED}
    LOSS_TARGET_PERCENT: ${LOSS_TARGET_PERCENT:-0}
    LOSS_PROBE_PACKETS: ${LOSS_PROBE_PACKETS:-200}
    HANDSHAKE_TIMEOUT_SECONDS: ${HANDSHAKE_TIMEOUT_SECONDS:-30}
services:
  server:
    <<: *lab
    command: ["python3", "/opt/measurement/serve.py"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/measurement-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  client:
    <<: *lab
    entrypoint: ["/opt/network-loss/client.sh"]
    command: []

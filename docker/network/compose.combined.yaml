name: mtcombined
x-lab: &lab
  image: mt-tls-network:local
  cap_add: [NET_ADMIN]
  volumes:
    - ../..:/repo:ro
    - ../../artifacts/results:/work/results
    - ../../campaigns/network/combined:/opt/network-combined:ro
    - ../../campaigns/common/pcap_capture.py:/opt/measurement/pcap_capture.py:ro
  environment:
    PROFILE_DETAIL: "0"
    NETWORK_PROFILE: ${NETWORK_PROFILE:?Set NETWORK_PROFILE}
    NETWORK_AUTH_MODE: ${NETWORK_AUTH_MODE:?Set NETWORK_AUTH_MODE}
    NETWORK_MTC_ID: ${NETWORK_MTC_ID:?Set NETWORK_MTC_ID}
    NETWORK_SINGLE_ROOT: ${NETWORK_SINGLE_ROOT:?Set NETWORK_SINGLE_ROOT}
    NETWORK_MUTUAL_ROOT: ${NETWORK_MUTUAL_ROOT:?Set NETWORK_MUTUAL_ROOT}
    NETWORK_MUTUAL_SERVER_X509: ${NETWORK_MUTUAL_SERVER_X509:?Set NETWORK_MUTUAL_SERVER_X509}
    MEASUREMENT_PCAP: ${MEASUREMENT_PCAP:-0}
    MEASUREMENT_PCAP_FINALIZATION_SECONDS: "12"
    MEASUREMENT_RUN_ROOT: ${MEASUREMENT_RUN_ROOT:?Set MEASUREMENT_RUN_ROOT}
    MEASUREMENT_CAMPAIGN_ID: ${MEASUREMENT_CAMPAIGN_ID:?Set MEASUREMENT_CAMPAIGN_ID}
    MEASUREMENT_SEED: ${MEASUREMENT_SEED:?Set MEASUREMENT_SEED}
    NETWORK_PROFILE_JSON: ${NETWORK_PROFILE_JSON:?Set NETWORK_PROFILE_JSON}
    LOSS_TARGET_PERCENT: ${LOSS_TARGET_PERCENT:-0}
    PROBE_PACKETS: ${PROBE_PACKETS:-200}
    HANDSHAKE_TIMEOUT_SECONDS: ${HANDSHAKE_TIMEOUT_SECONDS:-30}
    NETWORK_ALLOW_FAILURES: "1"
services:
  server:
    <<: *lab
    command: ["sh", "-c", "python3 /opt/network-combined/apply_network.py && iperf3 -s -D && python3 /opt/measurement/server.py"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/measurement-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  client:
    <<: *lab
    entrypoint: ["/opt/network-combined/client.sh"]
    command: []
  capture:
    profiles: [pcap]
    image: mt-tls-capture:local
    network_mode: "service:server"
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ../../artifacts/results:/work/results
      - ../../campaigns/common:/opt/pcap-core:ro
    command: ["python3", "/opt/pcap-core/pcap_capture.py", "serve", "${MEASUREMENT_RUN_ROOT}/${MEASUREMENT_CAMPAIGN_ID}/pcap"]

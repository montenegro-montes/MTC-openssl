name: mtcompact
x-lab: &lab
  image: mt-tls-compact:local
  build:
    context: ..
    dockerfile: docker/Dockerfile.compact
services:
  setup:
    <<: *lab
    volumes:
      - ../artifacts:/work
    command: ["python3", "/opt/compact/prepare.py", "--both", "--output", "/work/compact/batch16", "--leaves", "16"]
  server:
    <<: *lab
    volumes:
      - ../artifacts:/work:ro
    environment:
      COMPACT_BATCH: ${COMPACT_BATCH:-/work/compact/batch16}
    command: ["python3", "/opt/compact/serve.py"]
    healthcheck:
      test: ["CMD", "python3", "/opt/compact/serve.py", "--health"]
      interval: 2s
      timeout: 2s
      retries: 15
  client:
    <<: *lab
    volumes:
      - ../artifacts:/work:ro
      - ../artifacts/results:/work/results
    environment:
      COMPACT_BATCH: ${COMPACT_BATCH:-/work/compact/batch16}
      TLS_HOST: server
    command: ["python3", "/opt/compact/benchmark.py", "--runs", "30"]

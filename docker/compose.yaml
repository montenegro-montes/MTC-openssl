name: mtc

services:
  mtc-log:
    build:
      context: ..
      dockerfile: docker/mtc_log/Dockerfile
    ports:
      - ${MTC_LOG_BIND_ADDRESS:-127.0.0.1}:${MTC_LOG_PORT:-8080}:8080
    volumes:
      - mtc-log-data:/data
    restart: "no"

  monitor-a:
    build:
      context: ..
      dockerfile: docker/monitor/Dockerfile
    command:
      - --log-url
      - ${MTC_MONITOR_LOG_URL:-http://mtc-log:8080}
      - --trusted-authority
      - /run/mtc-monitor/authority.bin
      - --checker
      - /usr/local/bin/check_snapshot
      - --state-directory
      - /var/lib/mtc-monitor
      - --interval
      - ${MTC_MONITOR_INTERVAL:-60}
    depends_on:
      - mtc-log
    volumes:
      - ${MTC_MONITOR_TRUSTED_AUTHORITY:-./monitor/authority.bin}:/run/mtc-monitor/authority.bin:ro
      - mtc-monitor-a-state:/var/lib/mtc-monitor
    restart: "no"

  monitor-b:
    build:
      context: ..
      dockerfile: docker/monitor/Dockerfile
    command:
      - --log-url
      - ${MTC_MONITOR_LOG_URL:-http://mtc-log:8080}
      - --trusted-authority
      - /run/mtc-monitor/authority.bin
      - --checker
      - /usr/local/bin/check_snapshot
      - --state-directory
      - /var/lib/mtc-monitor
      - --interval
      - ${MTC_MONITOR_INTERVAL:-60}
    depends_on:
      - mtc-log
    volumes:
      - ${MTC_MONITOR_TRUSTED_AUTHORITY:-./monitor/authority.bin}:/run/mtc-monitor/authority.bin:ro
      - mtc-monitor-b-state:/var/lib/mtc-monitor
    restart: "no"

  checkpoint-gossip:
    profiles: ["gossip"]
    build:
      context: ..
      dockerfile: docker/gossip/Dockerfile
    command:
      - --first
      - /views/a/checkpoint.json
      - --second
      - /views/b/checkpoint.json
      - --log-url
      - ${MTC_GOSSIP_LOG_URL:-http://mtc-log:8080}
    depends_on:
      - mtc-log
      - monitor-a
      - monitor-b
    volumes:
      - mtc-monitor-a-state:/views/a:ro
      - mtc-monitor-b-state:/views/b:ro
    restart: "no"

  external-cosigner:
    build:
      context: ..
      dockerfile: docker/external_cosigner/Dockerfile
    command:
      - python3
      - cosigner_http_service.py
      - --identity
      - ${COSIGNER_ID:-32473.102}
      - --key
      - /run/cosigner/external.key
      - --ca-id
      - ${CA_ID:-32473.101}
      - --family
      - ${FAMILY:-ecdsa-p256}
      - --state
      - /var/lib/mtc-cosigner/accepted.json
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --tls-cert
      - /run/cosigner/server.pem
      - --tls-key
      - /run/cosigner/server.key
      - --client-ca
      - /run/cosigner/client-ca.pem
      - --require-client-cert
    ports:
      - ${COSIGNER_BIND_ADDRESS:-127.0.0.1}:${COSIGNER_PORT:-8443}:8443
    volumes:
      - cosigner-secrets:/run/cosigner:ro
      - cosigner-state:/var/lib/mtc-cosigner
    restart: "no"

  provision:
    profiles: ["provision"]
    build:
      context: ..
      dockerfile: docker/external_cosigner/Dockerfile
    entrypoint: ["/bin/sh", "/app/provision.sh"]
    environment:
      COSIGNER_SERVER_NAME: ${COSIGNER_SERVER_NAME:-localhost}
      COSIGNER_SERVER_SAN: ${COSIGNER_SERVER_SAN:-DNS:localhost}
    volumes:
      - cosigner-secrets:/run/cosigner
      - ./external_cosigner/client:/client

volumes:
  mtc-log-data:
    external: true
    name: mtc-log-data
  cosigner-secrets:
    external: true
    name: mtc-external-cosigner_cosigner-secrets
  cosigner-state:
    external: true
    name: mtc-external-cosigner_cosigner-state
  mtc-monitor-a-state:
  mtc-monitor-b-state:

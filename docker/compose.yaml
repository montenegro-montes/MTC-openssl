name: mtc

services:
  mtc-log:
    build:
      context: ..
      dockerfile: docker/mtc_log/Dockerfile
    ports:
      - ${MTC_LOG_BIND_ADDRESS:-127.0.0.1}:${MTC_LOG_PORT:-8080}:8080
    volumes:
      - mtc-log-data:/data
    restart: "no"

  external-cosigner:
    build:
      context: ..
      dockerfile: docker/external_cosigner/Dockerfile
    command:
      - python3
      - cosigner_http_service.py
      - --identity
      - ${COSIGNER_ID:-32473.102}
      - --key
      - /run/cosigner/external.key
      - --ca-id
      - ${CA_ID:-32473.101}
      - --family
      - ${FAMILY:-ecdsa-p256}
      - --state
      - /var/lib/mtc-cosigner/accepted.json
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --tls-cert
      - /run/cosigner/server.pem
      - --tls-key
      - /run/cosigner/server.key
      - --client-ca
      - /run/cosigner/client-ca.pem
      - --require-client-cert
    ports:
      - ${COSIGNER_BIND_ADDRESS:-127.0.0.1}:${COSIGNER_PORT:-8443}:8443
    volumes:
      - cosigner-secrets:/run/cosigner:ro
      - cosigner-state:/var/lib/mtc-cosigner
    restart: "no"

  provision:
    profiles: ["provision"]
    build:
      context: ..
      dockerfile: docker/external_cosigner/Dockerfile
    entrypoint: ["/bin/sh", "/app/provision.sh"]
    environment:
      COSIGNER_SERVER_NAME: ${COSIGNER_SERVER_NAME:-localhost}
      COSIGNER_SERVER_SAN: ${COSIGNER_SERVER_SAN:-DNS:localhost}
    volumes:
      - cosigner-secrets:/run/cosigner
      - ./external_cosigner/client:/client

volumes:
  mtc-log-data:
    external: true
    name: mtc-log-data
  cosigner-secrets:
    external: true
    name: mtc-external-cosigner_cosigner-secrets
  cosigner-state:
    external: true
    name: mtc-external-cosigner_cosigner-state

name: mtc

services:
  mtc-log:
    build:
      context: ..
      dockerfile: docker/mtc_log/Dockerfile
    ports:
      - ${MTC_LOG_BIND_ADDRESS:-127.0.0.1}:${MTC_LOG_PORT:-8080}:8080
    volumes:
      - mtc-log-data:/data
    restart: "no"

  monitor-a:
    build:
      context: ..
      dockerfile: docker/monitor/Dockerfile
    command:
      - --log-url
      - ${MTC_MONITOR_LOG_URL:-http://mtc-log:8080}
      - --trusted-authority
      - /run/mtc-monitor/authority.bin
      - --checker
      - /usr/local/bin/check_snapshot
      - --state-directory
      - /var/lib/mtc-monitor
      - --interval
      - ${MTC_MONITOR_INTERVAL:-60}
      - --listen-host
      - ${MTC_MONITOR_LISTEN_HOST:-0.0.0.0}
      - --listen-port
      - ${MTC_MONITOR_PORT:-8081}
    depends_on:
      - mtc-log
    volumes:
      - ${MTC_MONITOR_TRUSTED_AUTHORITY:-./monitor/authority.bin}:/run/mtc-monitor/authority.bin:ro
      - mtc-monitor-a-state:/var/lib/mtc-monitor
    expose:
      - ${MTC_MONITOR_PORT:-8081}
    ports:
      - ${MONITOR_A_BIND_ADDRESS:-127.0.0.1}:${MONITOR_A_PORT:-18081}:8081
    restart: "no"

  monitor-b:
    build:
      context: ..
      dockerfile: docker/monitor/Dockerfile
    command:
      - --log-url
      - ${MTC_MONITOR_LOG_URL:-http://mtc-log:8080}
      - --trusted-authority
      - /run/mtc-monitor/authority.bin
      - --checker
      - /usr/local/bin/check_snapshot
      - --state-directory
      - /var/lib/mtc-monitor
      - --interval
      - ${MTC_MONITOR_INTERVAL:-60}
      - --listen-host
      - ${MTC_MONITOR_LISTEN_HOST:-0.0.0.0}
      - --listen-port
      - ${MTC_MONITOR_PORT:-8081}
    depends_on:
      - mtc-log
    volumes:
      - ${MTC_MONITOR_TRUSTED_AUTHORITY:-./monitor/authority.bin}:/run/mtc-monitor/authority.bin:ro
      - mtc-monitor-b-state:/var/lib/mtc-monitor
    expose:
      - ${MTC_MONITOR_PORT:-8081}
    ports:
      - ${MONITOR_B_BIND_ADDRESS:-127.0.0.1}:${MONITOR_B_PORT:-18082}:8081
    restart: "no"

  checkpoint-gossip:
    profiles: ["gossip"]
    build:
      context: ..
      dockerfile: docker/gossip/Dockerfile
    command:
      - --first-url
      - ${MTC_GOSSIP_FIRST_URL:-http://monitor-a:8081/checkpoint}
      - --second-url
      - ${MTC_GOSSIP_SECOND_URL:-http://monitor-b:8081/checkpoint}
      - --log-url
      - ${MTC_GOSSIP_LOG_URL:-http://mtc-log:8080}
    depends_on:
      - mtc-log
      - monitor-a
      - monitor-b
    restart: "no"

  rp-server:
    build:
      context: ..
      dockerfile: docker/rp_server/Dockerfile
    command:
      - --state
      - /var/lib/mtc-rp
      - --host
      - 0.0.0.0
      - --port
      - "8082"
    ports:
      - ${RP_SERVER_BIND_ADDRESS:-127.0.0.1}:${RP_SERVER_PORT:-18083}:8082
    volumes:
      - mtc-rp-state:/var/lib/mtc-rp
    restart: "no"

  rp-updater:
    build:
      context: ..
      dockerfile: docker/rp_updater/Dockerfile
    command:
      - --log-url
      - ${MTC_RP_LOG_URL:-http://mtc-log:8080}
      - --rp-url
      - ${MTC_RP_SERVER_URL:-http://rp-server:8082}
      - --trusted-authority
      - /run/mtc-rp/authority.bin
      - --checker
      - /usr/local/bin/check_snapshot
      - --landmarks
      - /run/mtc-rp/landmarks.txt
      - --state-directory
      - /var/lib/mtc-rp-updater
      - --interval
      - ${MTC_RP_UPDATE_INTERVAL:-60}
    depends_on:
      - mtc-log
      - rp-server
    volumes:
      - ${MTC_RP_TRUSTED_AUTHORITY:-./rp_updater/authority.bin}:/run/mtc-rp/authority.bin:ro
      - ${MTC_RP_LANDMARKS:-./rp_updater/landmarks.txt}:/run/mtc-rp/landmarks.txt:ro
      - mtc-rp-updater-state:/var/lib/mtc-rp-updater
    restart: "no"

  external-cosigner:
    build:
      context: ..
      dockerfile: docker/external_cosigner/Dockerfile
    command:
      - python3
      - cosigner_http_service.py
      - --identity
      - ${COSIGNER_ID:-32473.102}
      - --key
      - /run/cosigner/external.key
      - --ca-id
      - ${CA_ID:-32473.101}
      - --family
      - ${FAMILY:-ecdsa-p256}
      - --state
      - /var/lib/mtc-cosigner/accepted.json
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --tls-cert
      - /run/cosigner/server.pem
      - --tls-key
      - /run/cosigner/server.key
      - --client-ca
      - /run/cosigner/client-ca.pem
      - --require-client-cert
    ports:
      - ${COSIGNER_BIND_ADDRESS:-127.0.0.1}:${COSIGNER_PORT:-8443}:8443
    volumes:
      - cosigner-secrets:/run/cosigner:ro
      - cosigner-state:/var/lib/mtc-cosigner
    restart: "no"

  provision:
    profiles: ["provision"]
    build:
      context: ..
      dockerfile: docker/external_cosigner/Dockerfile
    entrypoint: ["/bin/sh", "/app/provision.sh"]
    environment:
      COSIGNER_SERVER_NAME: ${COSIGNER_SERVER_NAME:-localhost}
      COSIGNER_SERVER_SAN: ${COSIGNER_SERVER_SAN:-DNS:localhost}
    volumes:
      - cosigner-secrets:/run/cosigner
      - ${COSIGNER_CLIENT_DIRECTORY:-./external_cosigner/client}:/client

volumes:
  mtc-log-data:
    external: true
    name: mtc-log-data
  cosigner-secrets:
    external: true
    name: ${COSIGNER_SECRETS_VOLUME:-mtc-external-cosigner_cosigner-secrets}
  cosigner-state:
    external: true
    name: ${COSIGNER_STATE_VOLUME:-mtc-external-cosigner_cosigner-state}
  mtc-monitor-a-state:
  mtc-monitor-b-state:
  mtc-rp-state:
  mtc-rp-updater-state:

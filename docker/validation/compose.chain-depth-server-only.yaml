name: chaindepthserveronly

x-common: &common
  image: ${CHAIN_DEPTH_IMAGE:-mt-tls-measurement:local}
  volumes:
    - ../..:/repo:ro
    - ${CHAIN_DEPTH_FIXTURES:?Set CHAIN_DEPTH_FIXTURES}:/fixtures:ro
    - ${CHAIN_DEPTH_RESULTS:?Set CHAIN_DEPTH_RESULTS}:/results
  environment:
    CERT_FIXTURE: /fixtures/${CERT_PROFILE:?Set CERT_PROFILE}/${CHAIN_PROFILE:?Set CHAIN_PROFILE}
    SERVER_METRICS: /results/${CERT_CAMPAIGN:?Set CERT_CAMPAIGN}/endpoint-metrics
    PROFILE_DETAIL: "1"
    MTC_KEM_ID: ${MTC_KEM_ID:-x25519}
    MTC_KEM_LABEL: ${MTC_KEM_LABEL:-X25519}
    MTC_TLS_GROUP: ${MTC_TLS_GROUP:-X25519}

services:
  server:
    <<: *common
    command: ["python3", "/repo/campaigns/scaling/chain_depth_server_only/server.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;s=socket.create_connection(('127.0.0.1',4433),1);s.close()"]
      interval: 1s
      timeout: 1s
      retries: 30

  client:
    <<: *common
    environment:
      CERT_FIXTURE: /fixtures/${CERT_PROFILE:?Set CERT_PROFILE}/${CHAIN_PROFILE:?Set CHAIN_PROFILE}
      SERVER_METRICS: /results/${CERT_CAMPAIGN:?Set CERT_CAMPAIGN}/endpoint-metrics
      CAMPAIGN_OUTPUT: /results/${CERT_CAMPAIGN:?Set CERT_CAMPAIGN}/data
      PROFILE_DETAIL: "1"
      MTC_KEM_ID: ${MTC_KEM_ID:-x25519}
      MTC_KEM_LABEL: ${MTC_KEM_LABEL:-X25519}
      MTC_TLS_GROUP: ${MTC_TLS_GROUP:-X25519}
      FIXTURE_SHA256: ${FIXTURE_SHA256:?Set FIXTURE_SHA256}
      SOURCE_COMMIT: ${SOURCE_COMMIT:?Set SOURCE_COMMIT}
      IMAGE_ID: ${IMAGE_ID:?Set IMAGE_ID}
      CERT_PROFILE_NAME: ${CERT_PROFILE}
      CHAIN_PROFILE: ${CHAIN_PROFILE}
    command: ["python3", "/repo/campaigns/scaling/chain_depth_server_only/measure.py"]

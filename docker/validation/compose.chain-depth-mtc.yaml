name: chaindepthmtc

x-common: &common
  image: ${CHAIN_DEPTH_MTC_IMAGE:-mt-tls-mtc:local}
  volumes:
    - ../..:/repo:ro
    - ${MTC_ROOT:-/tmp/mtc-missing}:/mtc:ro
    - ${CHAIN_DEPTH_RESULTS:-/tmp/chain-depth-results-missing}:/results
  environment:
    MTC_ROOT: /mtc
    SERVER_METRICS: /results/${CERT_CAMPAIGN:-missing-campaign}/endpoint-metrics
    CERT_PROFILE: ${CERT_PROFILE:-missing-profile}
    PROFILE_DETAIL: "1"
    MTC_KEM_ID: ${MTC_KEM_ID:-x25519}
    MTC_KEM_LABEL: ${MTC_KEM_LABEL:-X25519}
    MTC_TLS_GROUP: ${MTC_TLS_GROUP:-X25519}

services:
  server:
    <<: *common
    command: ["python3", "/repo/campaigns/scaling/chain_depth_server_only/server_mtc.py"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;s=socket.create_connection(('127.0.0.1',4433),1);s.close()"]
      interval: 1s
      timeout: 1s
      retries: 30

  client:
    <<: *common
    environment:
      MTC_ROOT: /mtc
      SERVER_METRICS: /results/${CERT_CAMPAIGN:-missing-campaign}/endpoint-metrics
      CAMPAIGN_OUTPUT: /results/${CERT_CAMPAIGN:-missing-campaign}/data
      CERT_PROFILE: ${CERT_PROFILE:-missing-profile}
      CERT_PROFILE_NAME: ${CERT_PROFILE:-missing-profile}
      PROFILE_DETAIL: "1"
      MTC_KEM_ID: ${MTC_KEM_ID:-x25519}
      MTC_KEM_LABEL: ${MTC_KEM_LABEL:-X25519}
      MTC_TLS_GROUP: ${MTC_TLS_GROUP:-X25519}
      FIXTURE_SHA256: ${FIXTURE_SHA256:-missing-fixture-sha256}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-missing-source-commit}
      IMAGE_ID: ${IMAGE_ID:-missing-image-id}
    command: ["python3", "/repo/campaigns/scaling/chain_depth_server_only/measure_mtc.py"]

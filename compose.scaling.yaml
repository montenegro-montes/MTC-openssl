name: mtscaling
x-lab: &lab
  image: sha256:4b04891fc50251a422c3357f35f355151ea50150d0e678dadde8c8f97b968b43
  volumes:
    - ./artifacts:/work:ro
    - ./artifacts/results:/work/results
    - ./scaling_campaign:/opt/scaling:ro
  environment:
    COMPACT_BATCH: ${SCALING_FIXTURES:?Set SCALING_FIXTURES}/batch${TREE_SIZE:?Set TREE_SIZE}/compact
    MTC_BATCH: ${SCALING_FIXTURES}/batch${TREE_SIZE}/mtc
    PROFILE_DETAIL: ${SCALING_DETAIL:-0}
    PAPER_RUN_ROOT: ${PAPER_RUN_ROOT:?Set PAPER_RUN_ROOT}
    PAPER_CAMPAIGN_ID: ${PAPER_CAMPAIGN_ID:?Set PAPER_CAMPAIGN_ID}
    PAPER_SEED: ${PAPER_SEED:?Set PAPER_SEED}
services:
  server:
    <<: *lab
    command: ["python3", "/opt/paper/serve.py"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/paper-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
  client:
    <<: *lab
    command: ["python3", "/opt/paper/measure.py"]
